[project]
name = "lifeboat"
version = "1.0.0"
description = "Multi-cloud disaster recovery platform (AWS primary / Azure secondary)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyjwt>=2.8",
  "bcrypt>=4.1",
  "prometheus-client>=0.20",
  "opentelemetry-api>=1.25",
  "opentelemetry-sdk>=1.25",
  "opentelemetry-exporter-otlp-proto-http>=1.25",
  "opentelemetry-instrumentation-fastapi>=0.46b0",
  "httpx>=0.27",
]

[project.optional-dependencies]
aws = ["boto3>=1.34"]
azure = ["azure-identity>=1.16", "azure-mgmt-trafficmanager>=1.1", "azure-mgmt-rdbms>=10.1", "azure-storage-blob>=12.20"]
llm = ["anthropic>=0.40"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "mypy>=1.10", "moto[rds,route53,s3]>=5.0", "boto3>=1.34"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires PostgreSQL", "e2e: end-to-end DR scenario"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S101", "S311", "B008", "S105", "S106", "UP042", "SIM105"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]
