apiVersion: v1
kind: ServiceAccount
metadata:
  name: lifeboat-api
---
apiVersion: batch/v1
kind: Job
metadata:
  name: lifeboat-migrate
  annotations:
    argocd.argoproj.io/hook: PreSync
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels: { app.kubernetes.io/name: lifeboat-migrate }
    spec:
      restartPolicy: Never
      serviceAccountName: lifeboat-api
      securityContext: { runAsNonRoot: true, runAsUser: 10001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: migrate
          image: ghcr.io/your-org/lifeboat-api:latest
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef: { name: lifeboat-config }
            - secretRef: { name: lifeboat-secrets }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lifeboat-api
  labels: { app.kubernetes.io/name: lifeboat-api }
spec:
  replicas: 2   # one replica holds the PostgreSQL advisory-lock leadership and runs the DR engine
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  selector:
    matchLabels: { app.kubernetes.io/name: lifeboat-api }
  template:
    metadata:
      labels: { app.kubernetes.io/name: lifeboat-api }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: lifeboat-api
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001, seccompProfile: { type: RuntimeDefault } }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: { matchLabels: { app.kubernetes.io/name: lifeboat-api } }
      containers:
        - name: api
          image: ghcr.io/your-org/lifeboat-api:latest
          command: ["uvicorn", "--factory", "app.main:app_factory", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers"]
          ports: [{ name: http, containerPort: 8000 }]
          envFrom:
            - configMapRef: { name: lifeboat-config }
            - secretRef: { name: lifeboat-secrets }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            failureThreshold: 6
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            failureThreshold: 30
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: backups, mountPath: /app/var/backups }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: backups
          emptyDir: {}   # local-mode backups only; cloud mode writes to RDS snapshots / Azure backups
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: api
  labels: { app.kubernetes.io/name: lifeboat-api }
spec:
  selector: { app.kubernetes.io/name: lifeboat-api }
  ports: [{ name: http, port: 8000, targetPort: http }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: lifeboat-api
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: lifeboat-api }
