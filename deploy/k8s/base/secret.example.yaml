# NOT applied by kustomize. Secrets are provisioned out-of-band (External Secrets Operator syncing from
# AWS Secrets Manager / Azure Key Vault - see overlays), never committed. Keys the API expects:
apiVersion: v1
kind: Secret
metadata:
  name: lifeboat-secrets
  namespace: lifeboat
type: Opaque
stringData:
  LIFEBOAT_DATABASE_URL: "postgresql+psycopg://lifeboat:<from-secret-store>@<host>:5432/lifeboat"
  LIFEBOAT_JWT_SECRET: "<from-secret-store>"
  LIFEBOAT_BOOTSTRAP_ADMIN_PASSWORD: "<from-secret-store>"
  LIFEBOAT_ANTHROPIC_API_KEY: "<optional>"
