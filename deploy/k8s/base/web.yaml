apiVersion: apps/v1
kind: Deployment
metadata:
  name: lifeboat-web
  labels: { app.kubernetes.io/name: lifeboat-web }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: lifeboat-web }
  template:
    metadata:
      labels: { app.kubernetes.io/name: lifeboat-web }
    spec:
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 101, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: web
          image: ghcr.io/your-org/lifeboat-web:latest
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /, port: http }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /, port: http }, periodSeconds: 15 }
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: cache, mountPath: /var/cache/nginx }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: cache, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: web
  labels: { app.kubernetes.io/name: lifeboat-web }
spec:
  selector: { app.kubernetes.io/name: lifeboat-web }
  ports: [{ name: http, port: 80, targetPort: http }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: lifeboat-web
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: lifeboat-web }
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
